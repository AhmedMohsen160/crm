name: فحص المشروع

# يعمل تلقائيًا عند كل رفع أو Pull Request — يتأكد أن النظام
# يُبنى بلا أخطاء وأن كل الشاشات تعمل فعليًا في متصفح حقيقي.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crmci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/crmci
      AUTH_SECRET: ci-secret-not-used-in-production-0123456789
      SEED_ADMIN_EMAIL: admin@fasttrans.local
      SEED_ADMIN_PASSWORD: ChangeMe123!
      ADMIN_PASSWORD: ChangeMe123!
      TEAM_INITIAL_PASSWORD: FastTrans2026!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: تثبيت المكتبات
        run: npm ci

      - name: فحص الأنواع (TypeScript)
        run: npx tsc --noEmit

      - name: اختبار قاعدة تطبيع الهاتف (§١٤)
        run: npm run test:phone

      - name: تجهيز قاعدة البيانات
        run: npm run db:deploy

      - name: زرع الأساس (الأدوار والقوائم والإعدادات)
        run: npm run bootstrap

      - name: تعبئة بيانات الاختبار
        run: npm run db:seed

      - name: بناء النظام
        run: npm run build

      - name: تثبيت متصفح الاختبار
        run: npx playwright install --with-deps chromium

      - name: تشغيل النظام في الخلفية
        run: npm start &

      - name: انتظار جاهزية النظام
        run: npx wait-on http://localhost:3000/api/health --timeout 60000

      - name: اختبار كل الشاشات في متصفح حقيقي
        run: npm run test:e2e

      - name: حفظ لقطات الشاشة عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: لقطات-الاختبار
          path: test-screenshots/
          if-no-files-found: ignore
